<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title description">
  <title id="title">Udhav Wadhawan - systems builder</title>
  <desc id="description">A request flows from an interface through services and data, becoming a resilient connected system.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.52" stop-color="#0b1830"/>
      <stop offset="1" stop-color="#10162b"/>
    </linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="0.52" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#818cf8" stop-opacity=".22"/>
      <stop offset="1" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#94a3b8" stroke-opacity=".055"/>
    </pattern>
  </defs>

  <rect width="1200" height="360" rx="24" fill="url(#background)"/>
  <rect width="1200" height="360" rx="24" fill="url(#grid)"/>
  <circle cx="928" cy="178" r="225" fill="url(#glow)"/>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="72" y="92" fill="#67e8f9" font-size="15" font-weight="700" letter-spacing="4">SYSTEMS BUILDER</text>
    <text x="68" y="157" fill="#f8fafc" font-size="48" font-weight="750" letter-spacing="-1.5">Follow the request.</text>
    <text x="70" y="202" fill="#cbd5e1" font-size="22">Understand the whole path.</text>
    <text x="70" y="249" fill="#94a3b8" font-size="16">surface  /  logic  /  data  /  resilience</text>

    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M604 181H686L724 126H796L838 181H916L958 116H1044" stroke="#334155" stroke-width="10" opacity=".35" filter="url(#soft-glow)"/>
      <path d="M604 181H686L724 126H796L838 181H916L958 116H1044" stroke="url(#signal)" stroke-width="3"/>
      <path d="M686 181L724 237H810L838 181" stroke="#475569" stroke-width="2"/>
      <path d="M916 181L958 246H1044" stroke="#475569" stroke-width="2"/>
    </g>

    <g stroke-width="2">
      <g transform="translate(604 181)">
        <circle r="24" fill="#0e2238" stroke="#67e8f9"/>
        <path d="M-8 0H8M3-5L8 0 3 5" fill="none" stroke="#e0f2fe" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <g transform="translate(724 126)">
        <rect x="-29" y="-22" width="58" height="44" rx="10" fill="#151d3b" stroke="#818cf8"/>
        <path d="M-12-6H12M-12 1H6M-12 8H10" stroke="#c7d2fe" stroke-linecap="round"/>
      </g>
      <g transform="translate(724 237)">
        <circle r="20" fill="#121c35" stroke="#64748b"/>
        <path d="M-7-7L7 0-7 7Z" fill="#94a3b8" stroke="none"/>
      </g>
      <g transform="translate(838 181)">
        <circle r="29" fill="#171a38" stroke="#a78bfa"/>
        <circle r="8" fill="#a78bfa" stroke="none"/>
        <circle r="19" fill="none" stroke="#a78bfa" stroke-dasharray="3 5"/>
      </g>
      <g transform="translate(958 116)">
        <ellipse cy="-10" rx="30" ry="11" fill="#251a38" stroke="#f472b6"/>
        <path d="M928 106V134C928 140 941 145 958 145S988 140 988 134V106M928 120C928 126 941 131 958 131S988 126 988 120" fill="#251a38" stroke="#f472b6"/>
      </g>
      <g transform="translate(958 246)">
        <rect x="-27" y="-23" width="54" height="46" rx="12" fill="#151d36" stroke="#64748b"/>
        <path d="M-12 0H12M0-12V12" stroke="#94a3b8" stroke-linecap="round"/>
      </g>
      <g transform="translate(1044 116)">
        <circle r="25" fill="#27182f" stroke="#fb7185"/>
        <path d="M-10 1L-3 8 11-8" fill="none" stroke="#fecdd3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </g>

    <g fill="#94a3b8" font-size="11" font-weight="650" letter-spacing="1.2" text-anchor="middle">
      <text x="604" y="224">REQUEST</text>
      <text x="724" y="91">INTERFACE</text>
      <text x="724" y="273">EVENT</text>
      <text x="838" y="226">SERVICE</text>
      <text x="958" y="72">DATA</text>
      <text x="958" y="283">FALLBACK</text>
      <text x="1044" y="160">TRUST</text>
    </g>

    <circle cx="604" cy="181" r="4" fill="#ecfeff">
      <animate attributeName="opacity" values=".2;1;.2" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="838" cy="181" r="4" fill="#ede9fe">
      <animate attributeName="opacity" values="1;.2;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1044" cy="116" r="4" fill="#fff1f2">
      <animate attributeName="opacity" values=".2;1;.2" dur="2.4s" begin=".8s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
