name: Build 3D contribution landscape

on:
  schedule:
    # 03:00 IST
    - cron: "30 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Render contribution history
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out profile
        uses: actions/checkout@v5

      - name: Generate 3D contribution images
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Commit updated images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-3d-contrib
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh contribution landscape"
            git push
          fi
